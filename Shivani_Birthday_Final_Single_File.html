const frame = document.getElementById('birthday-frame');
let currentPage = 1;
function decodePage(index){
  const binary = atob(EMBEDDED_PAGES[index - 1]);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function showPage(page){
  if (!Number.isInteger(page) || page < 1 || page > EMBEDDED_PAGES.length) return;
  currentPage = page;
  frame.srcdoc = decodePage(page);
  window.scrollTo(0,0);
}
window.addEventListener('message', event => {
  if (event.source !== frame.contentWindow) return;
  const data = event.data;
  if (!data || data.type !== 'birthday-next') return;
  if (data.page !== currentPage + 1) return;
  showPage(data.page);
});
showPage(1);
